# Dog TV: random relaxing-video playback to a TV.
# get_dog_tv_url returns a random video (URL + extracted YouTube ID) from a
# shared list. Each TV script wakes the TV and launches the video.
#
# Bedroom is an Android TV (launched via ADB intent). Living Room is an LG
# webOS TV: it launches the TV's native YouTube app (system.launcher/launch),
# woken via the WoL helper script (see
# ../Universal Media Player/turn-on-living-room-tv.yaml). Google Cast is no
# longer used here: casttube's YouTube lounge pairing broke upstream (HTTP 400
# "Parameter missing" at get_lounge_token_batch), so quick_play youtube fails.

get_dog_tv_url:
  alias: Get Random Dog TV URL
  sequence:
    - variables:
        videos:
          - 'https://www.youtube.com/watch?v=ggkYESx1Fpc'
          - 'https://www.youtube.com/watch?v=nYcHi9EgUHs'
          - 'https://www.youtube.com/watch?v=ru1z02CXbaA'
          - 'https://www.youtube.com/watch?v=QVfiP1x-vng'
          - 'https://www.youtube.com/watch?v=j_-azXHHGVc'
        picked_url: "{{ videos | random }}"
        result:
          url: "{{ picked_url }}"
          video_id: "{{ picked_url.split('v=')[1].split('&')[0] }}"
    - stop: ""
      response_variable: result

dog_tv_bedroom:
  alias: Dog TV Bedroom
  sequence:
    - action: script.get_dog_tv_url
      response_variable: dog
    - action: media_player.turn_on
      target:
        entity_id: media_player.bedroom_tv
    - delay:
        seconds: 15
    - action: androidtv.adb_command
      target:
        entity_id: media_player.bedroom_tv_adb
      data:
        command: "am start -a android.intent.action.VIEW -d '{{ dog.url }}'"
  mode: single

dog_tv_living_room:
  alias: Dog TV (Living Room)
  sequence:
    - action: script.get_dog_tv_url
      response_variable: dog
    - action: script.turn_on_living_room_tv
    - delay: "00:00:05"          # let webOS finish waking before launching an app
    - action: webostv.command
      target:
        entity_id: media_player.lg_webos_tv_oled77c4aua_3    # webOS entity, not the Cast one
      data:
        command: system.launcher/launch
        payload:
          id: youtube.leanback.v4
          # Bare video id is the current format. If YouTube opens but the video
          # does not start playing, switch this to "v={{ dog.video_id }}".
          contentId: "{{ dog.video_id }}"
    - delay: "00:00:05"          # give the "Who's watching?" prompt time to appear
    - action: webostv.button
      target:
        entity_id: media_player.lg_webos_tv_oled77c4aua_3
      data:
        button: ENTER
  mode: single
